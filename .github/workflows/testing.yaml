---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: 'Test HTTP API Tool'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test (default: https://linuxfoundation.org)'
        required: false
        type: string
        default: 'https://linuxfoundation.org'
      expected_code:
        description: 'Expected HTTP status code'
        required: false
        type: string
        default: '200'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-uvx-mode:
    name: 'Test UVX Deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Test website with UVX mode
        id: test-uvx
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/http-api-tool-docker@12a062c2289831b79166269340ffb44fa2c113e9  # v1.0.7
        with:
          deploy: uvx
          url: ${{ inputs.url || 'https://linuxfoundation.org' }}
          service_name: 'Linux Foundation Website (UVX)'
          expected_http_code: ${{ inputs.expected_code || '200' }}
          retries: 3
          initial_sleep_time: 1
          max_delay: 5

      - name: Display UVX test results
        if: always()
        # yamllint disable rule:line-length
        run: |
          {
            echo "## 🚀 UVX Deployment Results"
            echo ""
            echo "- **Status Code**: ${STEPS_TEST_UVX_OUTPUTS_RESPONSE_HTTP_CODE}"
            echo "- **Total Time**: ${STEPS_TEST_UVX_OUTPUTS_TOTAL_TIME}s"
            echo "- **Connect Time**: ${STEPS_TEST_UVX_OUTPUTS_CONNECT_TIME}s"
            echo "- **Time Delay**: ${STEPS_TEST_UVX_OUTPUTS_TIME_DELAY}s"
            echo "- **Response Time Exceeded**: ${STEPS_TEST_UVX_OUTPUTS_RESPONSE_TIME_EXCEEDED}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_TEST_UVX_OUTPUTS_RESPONSE_HTTP_CODE: ${{ steps.test-uvx.outputs.response_http_code }}
          STEPS_TEST_UVX_OUTPUTS_TOTAL_TIME: ${{ steps.test-uvx.outputs.total_time }}
          STEPS_TEST_UVX_OUTPUTS_CONNECT_TIME: ${{ steps.test-uvx.outputs.connect_time }}
          STEPS_TEST_UVX_OUTPUTS_TIME_DELAY: ${{ steps.test-uvx.outputs.time_delay }}
          STEPS_TEST_UVX_OUTPUTS_RESPONSE_TIME_EXCEEDED: ${{ steps.test-uvx.outputs.response_time_exceeded }}
          # yamllint enable rule:line-length

  test-docker-mode:
    name: 'Test Docker Deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Test website with Docker mode
        id: test-docker
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/http-api-tool-docker@12a062c2289831b79166269340ffb44fa2c113e9  # v1.0.7
        with:
          deploy: docker
          url: ${{ inputs.url || 'https://linuxfoundation.org' }}
          service_name: 'Linux Foundation Website (Docker)'
          expected_http_code: ${{ inputs.expected_code || '200' }}
          retries: 3
          initial_sleep_time: 1
          max_delay: 5

      - name: Display Docker test results
        if: always()
        # yamllint disable rule:line-length
        run: |
          {
            echo "## 🐳 Docker Deployment Results"
            echo ""
            echo "- **Status Code**: ${STEPS_TEST_DOCKER_OUTPUTS_RESPONSE_HTTP_CODE}"
            echo "- **Total Time**: ${STEPS_TEST_DOCKER_OUTPUTS_TOTAL_TIME}s"
            echo "- **Connect Time**: ${STEPS_TEST_DOCKER_OUTPUTS_CONNECT_TIME}s"
            echo "- **Time Delay**: ${STEPS_TEST_DOCKER_OUTPUTS_TIME_DELAY}s"
            echo "- **Response Time Exceeded**: ${STEPS_TEST_DOCKER_OUTPUTS_RESPONSE_TIME_EXCEEDED}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_TEST_DOCKER_OUTPUTS_RESPONSE_HTTP_CODE: ${{ steps.test-docker.outputs.response_http_code }}
          STEPS_TEST_DOCKER_OUTPUTS_TOTAL_TIME: ${{ steps.test-docker.outputs.total_time }}
          STEPS_TEST_DOCKER_OUTPUTS_CONNECT_TIME: ${{ steps.test-docker.outputs.connect_time }}
          STEPS_TEST_DOCKER_OUTPUTS_TIME_DELAY: ${{ steps.test-docker.outputs.time_delay }}
          STEPS_TEST_DOCKER_OUTPUTS_RESPONSE_TIME_EXCEEDED: ${{ steps.test-docker.outputs.response_time_exceeded }}
          # yamllint enable rule:line-length

  compare-results:
    name: 'Compare Deployment Modes'
    runs-on: ubuntu-latest
    needs: [test-uvx-mode, test-docker-mode]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Compare performance
        env:
          TEST_URL: "${{ inputs.url || 'https://linuxfoundation.org' }}"
          EXPECTED_CODE: "${{ inputs.expected_code || '200' }}"
        # yamllint disable rule:line-length
        run: |
          {
            echo "## 📊 Deployment Mode Comparison"
            echo ""
            echo "Both deployment modes tested the same endpoint in parallel."
            echo ""
            echo "### Test Configuration"
            echo "- **URL**: $TEST_URL"
            echo "- **Expected Code**: $EXPECTED_CODE"
            echo ""
            echo "### Results"
            echo "Check the individual job summaries above for detailed metrics."
          } >> "$GITHUB_STEP_SUMMARY"
